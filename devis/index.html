<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- GTM + GA chargés uniquement après consentement (bannière cookies en bas de page) -->
  <script>
    function abiwebLoadAnalytics() {
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-N439P2KJ');
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-S2QVJFM4L5';
      document.head.appendChild(s);

      window.gtag = gtag;

      gtag('config', 'G-S2QVJFM4L5');

    if (localStorage.getItem('abiweb-consent') === 'granted') abiwebLoadAnalytics();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbiWeb — Bientôt disponible</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/images/logo/abiweb-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #0f0f11; --paper: #f8f7f4; --mid: #6b6b72; --accent: #3b5bdb; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { height: 40px; margin-bottom: 2rem; }
    h1 { font-family: 'Poppins', sans-serif; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { font-size: 1rem; color: var(--mid); max-width: 420px; margin: 0 auto 1.75rem; line-height: 1.6; }
    a.contact { color: var(--accent); text-decoration: none; font-weight: 600; }
    a.contact:hover { text-decoration: underline; }
    .cookie-banner { position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 200; max-width: 560px; margin: 0 auto; background: var(--ink); border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 8px 32px rgba(0,0,0,0.25); text-align: left; }
    .cookie-banner p { color: rgba(255,255,255,0.85); font-size: 0.85rem; max-width: none; margin: 0 0 0.75rem; }
    .cookie-banner a { color: #9db1f5; }
    .cookie-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .cookie-actions button { font-family: inherit; font-size: 0.85rem; font-weight: 600; border-radius: 7px; padding: 0.5rem 1rem; cursor: pointer; }
    #cookieAccept { background: var(--accent); color: #fff; border: none; }
    #cookieRefuse { background: transparent; color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.3); }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div>
    <img class="logo" src="/images/logo/abiweb-logo.svg" alt="AbiWeb" />
    <h1>Bientôt disponible</h1>
    <p>Nouveau site en préparation. Revenez très vite !</p>
    <a class="contact" href="mailto:contact@abiweb.fr">contact@abiweb.fr</a>
  </div>
  <div class="cookie-banner" id="cookieBanner" hidden>
    <p>Ce site utilise des cookies de mesure d'audience (Google Analytics), déposés uniquement avec votre accord. <a href="/mentions-legales">En savoir plus</a></p>
    <div class="cookie-actions">
      <button id="cookieRefuse">Continuer sans accepter</button>
      <button id="cookieAccept">Accepter</button>
    </div>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('cookieBanner');
      function choose(value) {
        localStorage.setItem('abiweb-consent', value);
        banner.hidden = true;
        if (value === 'granted') abiwebLoadAnalytics();
      }
      document.getElementById('cookieAccept').addEventListener('click', function () { choose('granted'); });
      document.getElementById('cookieRefuse').addEventListener('click', function () { choose('denied'); });
      if (!localStorage.getItem('abiweb-consent')) banner.hidden = false;
      window.abiwebCookieChoice = function () {
        localStorage.removeItem('abiweb-consent');
        banner.hidden = false;
      };
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbiWeb — Bientôt disponible</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #0f0f11; --paper: #f8f7f4; --mid: #6b6b72; --accent: #3b5bdb; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 2rem; }
    .logo span { color: var(--accent); }
    h1 { font-family: 'Poppins', sans-serif; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { font-size: 1rem; color: var(--mid); max-width: 420px; margin: 0 auto 1.75rem; line-height: 1.6; }
    a.contact { color: var(--accent); text-decoration: none; font-weight: 600; }
    a.contact:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div>
    <p class="logo">Abi<span>Web</span></p>
    <h1>Bientôt disponible</h1>
    <p>Nouveau site en préparation. Revenez très vite !</p>
    <a class="contact" href="mailto:contact@abiweb.fr">contact@abiweb.fr</a>
  </div>
</body>
</html>

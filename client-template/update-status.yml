name: Update project status

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!project-status'
  workflow_dispatch:
    inputs:
      etape:
        description: Étape vérifiée du projet
        type: choice
        required: true
        options:
          - paiement_recu
          - developpement
          - preview
          - corrections
          - mise_en_ligne
          - garantie_retouches
      site_en_ligne:
        description: Le déploiement a réussi et le site est accessible sur son domaine
        type: boolean
        default: false
      message:
        description: Message public facultatif (aucune donnée confidentielle)
        type: string

# Un seul producteur écrit la source de suivi commune à toutes les branches.
permissions:
  contents: write
concurrency:
  group: abiweb-project-status
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Lire le dernier état publié
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/project-status; then
            git show refs/remotes/origin/project-status:status.json > "$RUNNER_TEMP/abiweb-current-status.json"
          else
            git show refs/remotes/origin/main:status.json > "$RUNNER_TEMP/abiweb-current-status.json"
          fi
      - name: Calculer une transition sans régression
        env:
          STATUS_EVENT_NAME: ${{ github.event_name }}
          STATUS_EVENT_REF: ${{ github.ref }}
          STATUS_REQUESTED_STEP: ${{ inputs.etape }}
          STATUS_SITE_IS_LIVE: ${{ inputs.site_en_ligne }}
          STATUS_MESSAGE: ${{ inputs.message }}
        run: node .github/scripts/update-status.mjs "$RUNNER_TEMP/abiweb-current-status.json" "$RUNNER_TEMP/abiweb-next-status.json"
      - name: Publier dans la branche de données
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/project-status; then
            git checkout -B project-status origin/project-status
          else
            git checkout --orphan project-status
            git rm -r --cached .
          fi
          cp "$RUNNER_TEMP/abiweb-next-status.json" status.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: mise à jour du suivi public"
          git push origin HEAD:project-status

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable - AbiWeb</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/images/logo/abiweb-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #0f0f11; --paper: #f8f7f4; --mid: #6b6b72; --accent: #3b5bdb; --line: #e2e1de; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { height: 40px; margin-bottom: 2rem; }
    .code { font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.75rem; }
    h1 { font-family: 'Poppins', sans-serif; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1rem; }
    p { font-size: 1rem; color: var(--mid); max-width: 420px; margin: 0 auto 2rem; line-height: 1.6; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: var(--accent); color: #fff; text-decoration: none; padding: 0.8rem 1.75rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; }
    .btn-primary:hover { background: #2f4ec4; }
    .btn-secondary { background: transparent; color: var(--ink); text-decoration: none; padding: 0.8rem 1.75rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; border: 1.5px solid var(--line); }
    .btn-secondary:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <div>
    <img class="logo" src="/images/logo/abiweb-logo.svg" alt="AbiWeb" />
    <p class="code">Erreur 404</p>
    <h1>Cette page n'existe pas</h1>
    <p>La page que vous cherchez a peut-être été déplacée ou n'existe plus. Retrouvez tout ce qu'il faut depuis l'accueil.</p>
    <div class="actions">
      <a class="btn-primary" href="/">Retour à l'accueil</a>
      <a class="btn-secondary" href="/devis">Demander un devis</a>
    </div>
  </div>
</body>
</html>
